
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobTrack - Applications</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<style>

/* =========================================================
   COLOUR
========================================================= */

:root{
    --navy:#102a43;
    --deep:#164e63;
    --teal:#2a9d8f;
    --cream:#f7f3e9;

    --bg:#f4f7f6;
    --text:#243b53;
    --muted:#829ab1;
    --line:#d9e2ec;

    --white:#ffffff;
}


/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;

    background:var(--bg);

    color:var(--text);

    font-family:
    Arial,
    Helvetica,
    sans-serif;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{
    background:var(--navy);

    height:76px;
}

.nav-container{

    width:100%;

    max-width:1200px;

    height:76px;

    margin:0 auto;

    padding:0 24px;

    display:flex;

    align-items:center;
}


/* LOGO */

.brand{

    color:white;

    text-decoration:none;

    font-size:24px;

    font-weight:800;

    letter-spacing:-.5px;
}

.brand span{

    color:var(--teal);
}


/* NAV MENU */

.nav-menu{

    margin-left:auto;

    display:flex;

    align-items:center;

    gap:6px;
}


.nav-menu a,
.logout-btn{

    height:42px;

    padding:0 17px;

    border-radius:8px;

    display:flex;

    align-items:center;

    gap:7px;

    text-decoration:none;

    font-size:14px;

    font-weight:600;

    border:0;

    transition:.2s;
}


.nav-menu a{

    color:#d9e2ec;
}

.nav-menu a:hover{

    background:var(--deep);

    color:white;
}


/* ACTIVE */

.nav-menu a.active{

    background:var(--teal);

    color:var(--navy);
}


/* LOGOUT */

.logout-btn{

    background:transparent;

    color:#d9e2ec;

    cursor:pointer;
}

.logout-btn:hover{

    background:#7f1d1d;

    color:white;
}


/* =========================================================
   MAIN
========================================================= */

.main-container{

    max-width:1200px;

    margin:auto;

    padding:38px 24px 55px;
}


/* =========================================================
   PAGE HERO
========================================================= */

.page-hero{

    background:

    linear-gradient(
        135deg,
        var(--navy),
        var(--deep)
    );

    border-radius:18px;

    padding:30px 34px;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;
}


.hero-text h1{

    margin:0;

    font-size:29px;

    font-weight:800;
}

.hero-text p{

    margin:8px 0 0;

    color:#c7d4df;

    font-size:14px;
}


.hero-button{

    border:0;

    background:var(--teal);

    color:var(--navy);

    padding:12px 18px;

    border-radius:9px;

    font-size:13px;

    font-weight:800;

    cursor:pointer;

    display:flex;

    align-items:center;

    gap:7px;

    transition:.2s;
}

.hero-button:hover{

    transform:translateY(-2px);

    background:#3bc9b7;
}


/* =========================================================
   SUMMARY STRIP
========================================================= */

.summary-strip{

    background:var(--navy);

    border-radius:14px;

    padding:17px 20px;

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    gap:10px;

    margin-bottom:20px;
}


.summary-box{

    text-align:center;

    padding:8px;
}


.summary-box h3{

    margin:0;

    color:white;

    font-size:23px;

    font-weight:800;
}


.summary-box p{

    margin:4px 0 0;

    color:#9fb3c8;

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:.6px;
}


.summary-box.active{

    background:
    rgba(42,157,143,.18);

    border-radius:10px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

    background:white;

    border:1px solid var(--line);

    border-radius:14px;

    padding:15px;

    display:flex;

    gap:10px;

    align-items:center;

    margin-bottom:20px;

    box-shadow:
    0 5px 15px rgba(16,42,67,.04);
}


.search-box{

    flex:1;

    position:relative;
}


.search-box i{

    position:absolute;

    left:13px;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted);
}


.search-box input{

    width:100%;

    height:43px;

    padding:
    0 14px 0 39px;

    border:1px solid var(--line);

    border-radius:8px;

    outline:none;

    font-size:13px;

    color:var(--text);
}

.search-box input:focus{

    border-color:var(--teal);

    box-shadow:
    0 0 0 3px rgba(42,157,143,.1);
}


/* SELECT */

.filter-select{

    height:43px;

    min-width:160px;

    border:1px solid var(--line);

    border-radius:8px;

    padding:0 12px;

    color:var(--text);

    background:white;

    outline:none;

    font-size:12px;
}

.filter-select:focus{

    border-color:var(--teal);
}


/* =========================================================
   APPLICATION LIST
========================================================= */

.application-list{

    display:grid;

    gap:14px;
}


/* =========================================================
   APPLICATION CARD
========================================================= */

.application-card{

    background:white;

    border:1px solid var(--line);

    border-radius:15px;

    padding:20px;

    display:grid;

    grid-template-columns:
    auto 1fr auto;

    gap:17px;

    align-items:center;

    box-shadow:
    0 5px 15px rgba(16,42,67,.04);

    transition:.2s;
}


.application-card:hover{

    border-color:#b8dcd7;

    transform:translateY(-1px);

    box-shadow:
    0 8px 22px rgba(16,42,67,.07);
}


/* COMPANY LOGO */

.company-logo{

    width:54px;

    height:54px;

    border-radius:14px;

    background:var(--cream);

    color:var(--teal);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:19px;

    font-weight:800;

    flex-shrink:0;
}


/* JOB INFO */

.job-info{

    min-width:0;
}


.job-title{

    margin:0;

    font-size:16px;

    font-weight:800;

    color:var(--text);
}


.company-name{

    margin-top:5px;

    color:var(--muted);

    font-size:12px;
}


.application-meta{

    display:flex;

    gap:15px;

    margin-top:9px;

    flex-wrap:wrap;
}


.meta-item{

    color:#829ab1;

    font-size:10px;

    display:flex;

    align-items:center;

    gap:4px;
}

.meta-item i{

    color:var(--teal);
}


/* RIGHT SIDE */

.application-right{

    display:flex;

    align-items:center;

    gap:15px;
}


/* STATUS */

.status{

    padding:7px 12px;

    border-radius:30px;

    font-size:10px;

    font-weight:800;

    white-space:nowrap;
}


.status-submitted{

    background:#e8f6f3;

    color:#176b61;
}


.status-review{

    background:#e9f0f5;

    color:#164e63;
}


.status-interview{

    background:#fff4d6;

    color:#8a6500;
}


.status-selected{

    background:#e4f4e7;

    color:#28723d;
}


.status-rejected{

    background:#fbe8e5;

    color:#963f32;
}


/* ACTION BUTTONS */

.card-actions{

    display:flex;

    gap:6px;
}


.icon-btn{

    width:35px;

    height:35px;

    border:1px solid var(--line);

    background:white;

    border-radius:8px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    color:var(--muted);

    transition:.2s;
}


.icon-btn:hover{

    border-color:var(--teal);

    color:var(--teal);

    background:#f2faf9;
}


.icon-btn.delete:hover{

    border-color:#e5a9a0;

    color:#b94a3d;

    background:#fff5f3;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state{

    background:white;

    border:1px dashed #b8c9d6;

    border-radius:15px;

    text-align:center;

    padding:60px 20px;

    color:var(--muted);
}


.empty-state i{

    font-size:40px;

    color:var(--teal);

    display:block;

    margin-bottom:10px;
}


.empty-state h3{

    margin:0;

    color:var(--text);

    font-size:17px;
}


.empty-state p{

    margin:7px 0 18px;

    font-size:12px;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{

    position:fixed;

    inset:0;

    background:
    rgba(16,42,67,.55);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:9999;
}


.modal-overlay.show{

    display:flex;
}


.modal-box{

    width:100%;

    max-width:580px;

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:17px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.2);
}


/* MODAL HEADER */

.modal-header{

    background:var(--navy);

    color:white;

    padding:22px 25px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}


.modal-header h2{

    margin:0;

    font-size:19px;
}


.close-modal{

    width:34px;

    height:34px;

    border:0;

    border-radius:8px;

    background:rgba(255,255,255,.1);

    color:white;

    cursor:pointer;

    font-size:18px;
}


/* MODAL BODY */

.modal-body{

    padding:24px 25px;
}


.form-row{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:15px;
}


.form-group{

    margin-bottom:16px;
}


.form-group label{

    display:block;

    margin-bottom:6px;

    color:var(--text);

    font-size:11px;

    font-weight:800;
}


.form-group input,
.form-group select{

    width:100%;

    height:43px;

    border:1px solid var(--line);

    border-radius:8px;

    padding:0 12px;

    outline:none;

    font-size:12px;

    color:var(--text);

    background:white;
}


.form-group input:focus,
.form-group select:focus{

    border-color:var(--teal);

    box-shadow:
    0 0 0 3px rgba(42,157,143,.1);
}


/* MODAL FOOTER */

.modal-footer{

    display:flex;

    justify-content:flex-end;

    gap:8px;

    padding:0 25px 24px;
}


.btn-cancel{

    height:42px;

    padding:0 18px;

    border:1px solid var(--line);

    background:white;

    border-radius:8px;

    color:var(--text);

    font-size:12px;

    font-weight:700;

    cursor:pointer;
}


.btn-save{

    height:42px;

    padding:0 20px;

    border:0;

    background:var(--teal);

    border-radius:8px;

    color:var(--navy);

    font-size:12px;

    font-weight:800;

    cursor:pointer;
}


.btn-save:hover{

    background:#3bc9b7;
}


/* =========================================================
   FOOTER
========================================================= */

footer{

    background:var(--navy);

    color:#bcccdc;

    text-align:center;

    padding:18px;

    font-size:12px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

    .summary-strip{

        grid-template-columns:
        repeat(3,1fr);
    }

    .application-card{

        grid-template-columns:
        auto 1fr;
    }

    .application-right{

        grid-column:
        2;

        justify-content:space-between;
    }

}


@media(max-width:650px){

    .navbar{

        height:auto;
    }

    .nav-container{

        height:auto;

        padding:16px 18px;

        flex-direction:column;

        gap:15px;
    }

    .nav-menu{

        width:100%;

        justify-content:center;

        flex-wrap:wrap;

        margin:0;
    }

    .main-container{

        padding:
        25px 18px 40px;
    }

    .page-hero{

        padding:24px;

        flex-direction:column;

        align-items:flex-start;

        gap:20px;
    }

    .hero-button{

        width:100%;

        justify-content:center;
    }

    .summary-strip{

        grid-template-columns:
        repeat(2,1fr);
    }

    .toolbar{

        flex-direction:column;

        align-items:stretch;
    }

    .filter-select{

        width:100%;
    }

    .application-card{

        grid-template-columns:
        auto 1fr;

        padding:17px;
    }

    .application-right{

        grid-column:1 / -1;

        width:100%;

        justify-content:space-between;
    }

    .form-row{

        grid-template-columns:1fr;
    }

}


@media(max-width:430px){

    .summary-strip{

        grid-template-columns:1fr 1fr;
    }

    .application-card{

        grid-template-columns:
        1fr;
    }

    .company-logo{

        width:48px;

        height:48px;
    }

    .application-right{

        grid-column:auto;

        flex-wrap:wrap;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="navbar">

<div class="nav-container">


<a href="dashboard.html" class="brand">

Job<span>Track</span>

</a>


<div class="nav-menu">


<a href="dashboard.html">

<i class="bi bi-grid-1x2-fill"></i>

Dashboard

</a>


<a href="applications.html" class="active">

<i class="bi bi-file-earmark-text"></i>

Applications

</a>


<a href="companies.html">

<i class="bi bi-buildings"></i>

Companies

</a>


<button
class="logout-btn"
onclick="logout()">

<i class="bi bi-box-arrow-right"></i>

Logout

</button>

</nav>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="main-container">


<!-- =======================================================
     HERO
======================================================= -->

<section class="page-hero">

<div class="hero-text">

<h1>
Application Tracker
</h1>

<p>
Keep track of your job applications in one organised place.
</p>

</div>


<button
class="hero-button"
onclick="openAddModal()">

<i class="bi bi-plus-lg"></i>

Add Application

</button>

</section>



<!-- =======================================================
     SUMMARY
======================================================= -->

<section class="summary-strip">


<div class="summary-box active">

<h3 id="totalCount">
0
</h3>

<p>
All Applications
</p>

</div>


<div class="summary-box">

<h3 id="submittedCount">
0
</h3>

<p>
Submitted
</p>

</div>


<div class="summary-box">

<h3 id="reviewCount">
0
</h3>

<p>
Under Review
</p>

</div>


<div class="summary-box">

<h3 id="interviewCount">
0
</h3>

<p>
Interview
</p>

</div>


<div class="summary-box">

<h3 id="selectedCount">
0
</h3>

<p>
Selected
</p>

</div>


</section>



<!-- =======================================================
     TOOLBAR
======================================================= -->

<section class="toolbar">


<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search job title or company..."
oninput="renderApplications()">

<select
id="statusFilter"
class="filter-select"
onchange="renderApplications()">

<option value="all">
All Status
</option>

<option value="submitted">
Submitted

<option value="under review">
Under Review
</option>

<option value="interview">

</option>

<option value="selected">

</option>

<select
id="sortFilter"
class="filter-select"
onchange="renderApplications()">

<option value="newest">
Newest First
</option>

<option value="oldest">
Oldest First
</option>

<option value="az">
Job Title A-Z
</option>

<option value="za">
Job Title Z-A
</option>

</select>


</section>



<!-- =======================================================
     APPLICATION LIST
======================================================= -->

<section
id="applicationList"

</section>


</main>



<!-- =========================================================
     MODAL
========================================================= -->

<div
id="applicationModal"
class="modal-overlay">


<div class="modal-box">


<!-- HEADER -->

<div class="modal-header">

<h2 id="modalTitle">
Add New Application
</h2>


<button
class="close-modal"
onclick="closeModal()">

<i class="bi bi-x-lg"></i>

</button>

</div>



<!-- BODY -->

<div class="modal-body">

<form
id="applicationForm"
onsubmit="saveApplication(event)">

type="hidden"
id="editId">


<div class="form-row">

JOB TITLE
</label>

<input
type="text"
id="jobTitle"
placeholder="e.g. Frontend Developer"
required>

</div>

<label>
COMPANY
</label>

<input
type="text"
id="company"
placeholder="e.g. Google"
required>

</div>



<div class="form-row">


<div class="form-group">

LOCATION
</label>

type="text"
id="location"

type="date"
id="applicationDate"

STATUS
</label>

Submitted
</option>

Under Review
</option>

Interview
</option>

Selected
</option>

Not Selected
</option>

</div>

type="button"
class="btn-cancel"
onclick="closeModal()">

Cancel

</button>


<button
type="submit"
form="applicationForm"
class="btn-save">

<i class="bi bi-check-lg"></i>

Save Application

</button>

</div>


</div>

</div>

<script>

/* =========================================================
   LOGIN CHECK
========================================================= */

if(
    sessionStorage.getItem("jobSystemLoggedIn")
    !== "true"
){

    window.location.href =
    "login.html";

}


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
"jobTrackApplications";


/* =========================================================
   GET APPLICATIONS
========================================================= */

function getApplications(){

    try{

        const data =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            )
        );

        if(Array.isArray(data)){

            return data;

        }

    }

    catch(error){

        console.log(
            "Unable to read applications."
        );

    }

    return [];

}


/* =========================================================
   SAVE APPLICATIONS
========================================================= */

function saveApplications(data){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(data)

    );

}


/* =========================================================
   OPEN ADD MODAL
========================================================= */

function openAddModal(){

    document.getElementById(
        "applicationForm"
    ).reset();


    document.getElementById(
        "editId"
    ).value = "";


    document.getElementById(
        "modalTitle"
    ).textContent =
    "Add New Application";


    document.getElementById(
        "applicationDate"
    ).value =
    getToday();


    document.getElementById(
        "applicationModal"
    ).classList.add(
        "show"
    );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document.getElementById(
        "applicationModal"
    ).classList.remove(
        "show"
    );

}


/* =========================================================
   GET TODAY
========================================================= */

function getToday(){

    const today =
    new Date();

    const year =
    today.getFullYear();

    const month =
    String(
        today.getMonth()+1
    ).padStart(2,"0");

    const day =
    String(
        today.getDate()
    ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


/* =========================================================
   SAVE / EDIT
========================================================= */

function saveApplication(event){

    event.preventDefault();


    const applications =
    getApplications();


    const editId =
    document.getElementById(
        "editId"
    ).value;


    const application = {

        id:
        editId ||
        Date.now().toString(),

        jobTitle:
        document.getElementById(
            "jobTitle"
        ).value.trim(),

        company:
        document.getElementById(
            "company"
        ).value.trim(),

        location:
        document.getElementById(
            "location"
        ).value.trim(),

        date:
        document.getElementById(
            "applicationDate"
        ).value,

        status:
        document.getElementById(
            "applicationStatus"
        ).value

    };


    /* EDIT */

    if(editId){

        const index =
        applications.findIndex(
            app =>
            String(app.id)
            === String(editId)
        );


        if(index !== -1){

            applications[index] =
            application;

        }

    }


    /* ADD */

    else{

        applications.unshift(
            application
        );

    }


    saveApplications(
        applications
    );


    closeModal();


    renderApplications();


    updateSummary();

}


/* =========================================================
   EDIT
========================================================= */

function editApplication(id){

    const applications =
    getApplications();


    const app =
    applications.find(
        item =>
        String(item.id)
        === String(id)
    );


    if(!app){

        return;

    }


    document.getElementById(
        "editId"
    ).value =
    app.id;


    document.getElementById(
        "jobTitle"
    ).value =
    app.jobTitle ||
    app.position ||
    "";


    document.getElementById(
        "company"
    ).value =
    app.company ||
    "";


    document.getElementById(
        "location"
    ).value =
    app.location ||
    "";


    document.getElementById(
        "applicationDate"
    ).value =
    app.date ||
    "";


    document.getElementById(
        "applicationStatus"
    ).value =
    normaliseStatus(
        app.status
    );


    document.getElementById(
        "modalTitle"
    ).textContent =
    "Edit Application";


    document.getElementById(
        "applicationModal"
    ).classList.add(
        "show"
    );

}


/* =========================================================
   DELETE
========================================================= */

function deleteApplication(id){

    const confirmed =
    confirm(
        "Are you sure you want to delete this application?"
    );


    if(!confirmed){

        return;

    }


    let applications =
    getApplications();


    applications =
    applications.filter(
        app =>
        String(app.id)
        !== String(id)
    );


    saveApplications(
        applications
    );


    renderApplications();


    updateSummary();

}


/* =========================================================
   NORMALISE STATUS
========================================================= */

function normaliseStatus(status){

    const value =
    String(
        status || "Submitted"
    )
    .trim()
    .toLowerCase();


    if(value === "submitted"){

        return "Submitted";

    }

    if(value === "under review"){

        return "Under Review";

    }

    if(value === "interview"){

        return "Interview";

    }

    if(
        value === "selected" ||
        value === "accepted" ||
        value === "offer"
    ){

        return "Selected";

    }

    if(
        value === "not selected" ||
        value === "rejected"
    ){

        return "Not Selected";

    }


    return "Submitted";

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(status){

    switch(
        normaliseStatus(
            status
        ).toLowerCase()
    ){

        case "submitted":

            return "status-submitted";


        case "under review":

            return "status-review";


        case "interview":

            return "status-interview";


        case "selected":

            return "status-selected";


        case "not selected":

            return "status-rejected";


        default:

            return "status-review";

    }

}


/* =========================================================
   RENDER APPLICATIONS
========================================================= */

function renderApplications(){

    let applications =
    getApplications();


    const search =
    document.getElementById(
        "searchInput"
    ).value
    .toLowerCase()
    .trim();


    const status =
    document.getElementById(
        "statusFilter"
    ).value;


    const sort =
    document.getElementById(
        "sortFilter"
    ).value;


    /* SEARCH */

    applications =
    applications.filter(
        app => {

            const title =
            String(
                app.jobTitle ||
                app.position ||
                ""
            ).toLowerCase();


            const company =
            String(
                app.company ||
                ""
            ).toLowerCase();


            return (
                title.includes(search)
                ||
                company.includes(search)
            );

        }
    );


    /* STATUS FILTER */

    if(status !== "all"){

        applications =
        applications.filter(
            app => {

                return (
                    normaliseStatus(
                        app.status
                    ).toLowerCase()
                    === status
                );

            }
        );

    }


    /* SORT */

    if(sort === "newest"){

        applications.sort(
            (a,b) =>
            new Date(
                b.date || 0
            )
            -
            new Date(
                a.date || 0
            )
        );

    }


    else if(sort === "oldest"){

        applications.sort(
            (a,b) =>
            new Date(
                a.date || 0
            )
            -
            new Date(
                b.date || 0
            )
        );

    }


    else if(sort === "az"){

        applications.sort(
            (a,b) =>
            String(
                a.jobTitle ||
                a.position ||
                ""
            ).localeCompare(
                String(
                    b.jobTitle ||
                    b.position ||
                    ""
                )
            )
        );

    }


    else if(sort === "za"){

        applications.sort(
            (a,b) =>
            String(
                b.jobTitle ||
                b.position ||
                ""
            ).localeCompare(
                String(
                    a.jobTitle ||
                    a.position ||
                    ""
                )
            )
        );

    }


    const container =
    document.getElementById(
        "applicationList"
    );


    /* EMPTY */

    if(applications.length === 0){

        container.innerHTML = `

        <div class="empty-state">

            <i class="bi bi-search"></i>

            <h3>
            No applications found
            </h3>

            <p>
            Try another search or add a new application.
            </p>

            <button
            class="hero-button"
            onclick="openAddModal()">

                <i class="bi bi-plus-lg"></i>

                Add Application

            </button>

        </div>

        `;

        return;

    }


    /* CARDS */

    container.innerHTML =

    applications.map(
        app => {


            const title =
            app.jobTitle ||
            app.position ||
            "Job Application";


            const company =
            app.company ||
            "Company";


            const location =
            app.location ||
            "Location not provided";


            const date =
            app.date ||
            "";


            const status =
            normaliseStatus(
                app.status
            );


            const initial =
            company
            .charAt(0)
            .toUpperCase();


            return `

            <article
            class="application-card">


                <!-- COMPANY LOGO -->

                <div class="company-logo">

                    ${escapeHTML(
                        initial
                    )}

                </div>


                <!-- INFORMATION -->

                <div class="job-info">

                    <h3
                    class="job-title">

                        ${escapeHTML(
                            title
                        )}

                    </h3>


                    <div
                    class="company-name">

                        ${escapeHTML(
                            company
                        )}

                    </div>


                    <div
                    class="application-meta">


                        <div
                        class="meta-item">

                            <i
                            class="bi bi-geo-alt"></i>

                            ${escapeHTML(
                                location
                            )}

                        </div>


                        <div
                        class="meta-item">

                            <i
                            class="bi bi-calendar3"></i>

                            ${formatDate(
                                date
                            )}

                        </div>


                    </div>

                </div>


                <!-- RIGHT -->

                <div
                class="application-right">


                    <span
                    class="status ${getStatusClass(status)}">

                        ${escapeHTML(
                            status
                        )}

                    </span>


                    <div
                    class="card-actions">


                        <button
                        class="icon-btn"
                        onclick="editApplication('${escapeHTML(String(app.id))}')"
                        title="Edit">

                            <i class="bi bi-pencil"></i>

                        </button>


                        <button
                        class="icon-btn delete"
                        onclick="deleteApplication('${escapeHTML(String(app.id))}')"
                        title="Delete">

                            <i class="bi bi-trash3"></i>

                        </button>


                    </div>

                </div>


            </article>

            `;

        }
    )
    .join("");

}


/* =========================================================
   UPDATE SUMMARY
========================================================= */

function updateSummary(){

    const applications =
    getApplications();


    document.getElementById(
        "totalCount"
    ).textContent =
    applications.length;


    document.getElementById(
        "submittedCount"
    ).textContent =
    applications.filter(
        app =>
        normaliseStatus(
            app.status
        ) === "Submitted"
    ).length;


    document.getElementById(
        "reviewCount"
    ).textContent =
    applications.filter(
        app =>
        normaliseStatus(
            app.status
        ) === "Under Review"
    ).length;


    document.getElementById(
        "interviewCount"
    ).textContent =
    applications.filter(
        app =>
        normaliseStatus(
            app.status
        ) === "Interview"
    ).length;


    document.getElementById(
        "selectedCount"
    ).textContent =
    applications.filter(
        app =>
        normaliseStatus(
            app.status
        ) === "Selected"
    ).length;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(date){

    if(!date){

        return "No date";

    }


    const d =
    new Date(date);


    if(isNaN(
        d.getTime()
    )){

        return date;

    }


    return d.toLocaleDateString(
        "en-GB",
        {

            day:"2-digit",

            month:"short",

            year:"numeric"

        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value)

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    const confirmed =
    confirm(
        "Are you sure you want to logout?"
    );


    if(confirmed){

        sessionStorage.removeItem(
            "jobSystemLoggedIn"
        );

        window.location.href =
        "login.html";

    }

}


/* =========================================================
   CLOSE MODAL WHEN CLICK OUTSIDE
========================================================= */

document.getElementById(
    "applicationModal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeModal();

        }

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

updateSummary();

renderApplications();

</script>
